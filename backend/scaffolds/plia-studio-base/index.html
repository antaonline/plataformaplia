<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PLIA Studio App</title>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!--
      PLIA Studio: capturador de ERRORES DE RUNTIME. Si la generación de
      la IA dejó código que rompe en runtime (import roto, export mismatch,
      undefined.foo), la pantalla queda en blanco y el cliente no entiende
      qué pasa. Este script captura el error y lo manda al editor padre
      via postMessage para que se vea en pantalla como un toast rojo con
      botón "AUTO-FIX". Inspirado en el overlay de error de Vite.

      Solo se activa si estamos dentro de PLIA Studio (parent !== self).
      En produccion (sitio publicado) este listener no envía nada porque
      no hay parent que escuche.
    -->
    <script>
      (function () {
        if (window.parent === window) return;
        var notify = function (kind, message, stack) {
          try {
            window.parent.postMessage(
              {
                type: 'PLIA_RUNTIME_ERROR',
                kind: kind,
                message: String(message || '').slice(0, 800),
                stack: stack ? String(stack).slice(0, 2000) : null,
                ts: Date.now(),
              },
              '*'
            );
          } catch (_) {}
        };
        window.addEventListener('error', function (e) {
          notify('error', e.message || e.error || 'Error desconocido', e.error && e.error.stack);
        });
        window.addEventListener('unhandledrejection', function (e) {
          var msg = e.reason && (e.reason.message || String(e.reason));
          notify('promise', msg || 'Promise rejected', e.reason && e.reason.stack);
        });
        // Watchdog: si tras 4 segundos el #root sigue vacío, asumimos que
        // hubo un error que window.onerror NO disparo (típicamente un
        // import roto que mata el module bootstrap sin throw global).
        setTimeout(function () {
          var root = document.getElementById('root');
          if (root && root.children.length === 0) {
            notify(
              'blank',
              'La página quedó en blanco — probable error de import o export entre componentes. Revisa la consola del navegador.',
              null
            );
          }
        }, 4000);
      })();
    </script>

    <!--
      PLIA Studio: capturador de miniaturas. Solo se activa si el iframe
      esta embebido en PLIA Studio (window.parent !== window) Y recibe el
      mensaje PLIA_CAPTURE. En produccion (sitio publicado, sin padre PLIA)
      este listener queda mudo y html2canvas NUNCA se carga -> 0 overhead.
    -->
    <!--
      PLIA Studio: REPORTE DE ALTURA del documento. El editor lo usa para
      desplegar la web COMPLETA (de arriba a abajo) en el artboard del
      lienzo, en vez de una ventana con scroll interno. Solo activo dentro
      de PLIA Studio (parent !== self).
    -->
    <script>
      (function () {
        if (window.parent === window) return;
        var last = 0;
        var send = function () {
          var h = Math.max(
            document.documentElement.scrollHeight,
            document.body ? document.body.scrollHeight : 0
          );
          if (Math.abs(h - last) > 4) {
            last = h;
            try {
              window.parent.postMessage({ type: 'PLIA_DOC_HEIGHT', height: h }, '*');
            } catch (_) {}
          }
        };
        var t;
        var debounced = function () { clearTimeout(t); t = setTimeout(send, 150); };
        window.addEventListener('load', debounced);
        if (window.ResizeObserver) {
          new ResizeObserver(debounced).observe(document.documentElement);
        }
        // Fallback para cambios async (imágenes/fuentes que cargan tarde).
        setInterval(debounced, 2000);
      })();
    </script>

    <!--
      PLIA Studio: BRIDGE DE SELECCIÓN (editor visual, Fase B). Permite que
      el editor padre active un "modo selección": al pasar el cursor se
      resalta el elemento, al hacer click se selecciona y se reporta su
      info (tag, texto, clases) al padre. También soporta editar el texto
      inline (contentEditable) y reporta el cambio. Solo activo dentro de
      PLIA Studio (parent !== self).
    -->
    <script>
      (function () {
        if (window.parent === window) return;
        var mode = 'none'; // 'none' | 'select'
        var hovered = null;
        var selected = null;
        var dropTarget = null;
        var styleEl = document.createElement('style');
        styleEl.textContent =
          '.plia-hover{outline:2px solid #6366f1 !important;outline-offset:-2px !important;cursor:pointer !important;}' +
          '.plia-selected{outline:2px solid #8b5cf6 !important;outline-offset:-2px !important;box-shadow:0 0 0 4px rgba(139,92,246,0.2) !important;}' +
          '.plia-editing{outline:2px dashed #10b981 !important;}' +
          '.plia-drop{outline:3px dashed #f59e0b !important;outline-offset:-3px !important;box-shadow:0 0 0 6px rgba(245,158,11,0.25) !important;}';
        document.head.appendChild(styleEl);

        function send(type, payload) {
          try { window.parent.postMessage(Object.assign({ type: type }, payload || {}), '*'); } catch (_) {}
        }
        // Reemplaza el src de una imagen RESPETANDO el layout del código:
        // congela la altura renderizada actual y fuerza object-fit cover,
        // así una imagen con otra proporción ENCAJA en la caja existente
        // en vez de deformar la sección.
        function swapImg(el, url) {
          var rect = el.getBoundingClientRect();
          var oldSrc = el.getAttribute('src');
          if (rect.height > 0) el.style.height = rect.height + 'px';
          el.style.objectFit = 'cover';
          el.setAttribute('src', url);
          send('PLIA_IMG_REPLACED', { oldSrc: oldSrc, newUrl: url });
        }
        // Deshacer/rehacer: reenviar Ctrl+Z / Ctrl+Shift+Z (o Ctrl+Y) al
        // editor aunque el foco esté dentro del sitio. No interferimos si
        // el usuario está editando texto inline (undo nativo del campo).
        window.addEventListener('keydown', function (e) {
          var t = e.target;
          if (t && (t.isContentEditable || t.tagName === 'INPUT' || t.tagName === 'TEXTAREA')) return;
          var k = (e.key || '').toLowerCase();
          if ((e.ctrlKey || e.metaKey) && k === 'z' && !e.shiftKey) {
            e.preventDefault();
            send('PLIA_UNDO', {});
          } else if ((e.ctrlKey || e.metaKey) && (k === 'y' || (k === 'z' && e.shiftKey))) {
            e.preventDefault();
            send('PLIA_REDO', {});
          }
        });
        // No queremos seleccionar elementos enormes (body, #root). Subimos al
        // elemento "significativo" más cercano (con texto o que sea media).
        function isSelectable(el) {
          if (!el || el === document.body) return false;
          if (el.id === 'root') return false;
          // Nuestra propia UI (marcadores de padding, resize, etiquetas) NO es
          // seleccionable: si no, hacer click en una barrita la "selecciona" y
          // se generan barritas sobre barritas.
          if (el.closest && el.closest('[data-plia-ui]')) return false;
          return true;
        }
        // ¿Es un contenedor de layout? El padding/resize solo se ofrece sobre
        // estos (section, div con hijos, header…), no sobre texto u hojas.
        var CONTAINER_TAGS = { SECTION: 1, DIV: 1, HEADER: 1, FOOTER: 1, NAV: 1, MAIN: 1, ARTICLE: 1, ASIDE: 1, FORM: 1, UL: 1, OL: 1 };
        function isContainer(el) {
          if (!el || el.tagName === 'IMG' || el.tagName === 'svg') return false;
          if (el.children && el.children.length > 0) return true;
          return !!CONTAINER_TAGS[el.tagName];
        }
        function describe(el) {
          var text = '';
          // Texto directo del elemento (no de hijos profundos) para edición.
          for (var i = 0; i < el.childNodes.length; i++) {
            if (el.childNodes[i].nodeType === 3) text += el.childNodes[i].nodeValue;
          }
          text = (text || el.textContent || '').trim();
          var rect = el.getBoundingClientRect();
          return {
            tag: el.tagName.toLowerCase(),
            text: text.slice(0, 500),
            fullText: (el.textContent || '').trim().slice(0, 500),
            classes: el.className && typeof el.className === 'string' ? el.className : '',
            isImage: el.tagName === 'IMG',
            src: el.tagName === 'IMG' ? el.getAttribute('src') : null,
            rect: { x: rect.left, y: rect.top, w: rect.width, h: rect.height },
          };
        }

        // REENVÍO DE RUEDA AL LIENZO: cuando el editor está en modo lienzo,
        // los eventos de rueda sobre el sitio NO deben hacer zoom/scroll
        // del navegador — se reenvían al editor padre para que el zoom/pan
        // del canvas siga funcionando aunque el cursor esté sobre la web.
        var canvasMode = false;
        window.addEventListener(
          'wheel',
          function (e) {
            // Ctrl/Cmd+rueda SIEMPRE se intercepta (evita el zoom del
            // navegador dentro del iframe). Rueda sola solo en modo lienzo.
            if (!canvasMode && !(e.ctrlKey || e.metaKey)) return;
            e.preventDefault();
            send('PLIA_WHEEL', {
              ctrlKey: e.ctrlKey || e.metaKey,
              shiftKey: e.shiftKey,
              deltaX: e.deltaX,
              deltaY: e.deltaY,
              clientX: e.clientX,
              clientY: e.clientY,
            });
          },
          { passive: false }
        );

        window.addEventListener('message', function (e) {
          if (!e.data) return;
          if (e.data.type === 'PLIA_SET_CANVAS_MODE') {
            canvasMode = !!e.data.on;
            return;
          }
          if (e.data.type === 'PLIA_SET_ZOOM') {
            padZoom = e.data.zoom || 1;
            layoutPadHandles();
            return;
          }
          if (e.data.type === 'PLIA_APPLY_OVERRIDES') {
            pendingOverrides = e.data.overrides || {};
            var tries = 0;
            var iv = setInterval(function () {
              tries++;
              applyOverrides();
              if (tries >= 8) clearInterval(iv);
            }, 350);
            return;
          }
          if (e.data.type === 'PLIA_SET_TOOL') {
            mode = e.data.tool === 'select' ? 'select' : 'none';
            if (mode === 'none') {
              if (hovered) { hovered.classList.remove('plia-hover'); hovered = null; }
              hidePadHandles();
            }
          } else if (e.data.type === 'PLIA_EDIT_TEXT' && selected) {
            hidePadHandles();
            // Hacer editable el elemento seleccionado.
            var before = selected.textContent;
            selected.setAttribute('contenteditable', 'true');
            selected.classList.add('plia-editing');
            selected.focus();
            var onBlur = function () {
              selected.removeAttribute('contenteditable');
              selected.classList.remove('plia-editing');
              selected.removeEventListener('blur', onBlur);
              var after = selected.textContent;
              if (after !== before) {
                send('PLIA_TEXT_CHANGED', { oldText: before.trim(), newText: after.trim() });
              }
            };
            selected.addEventListener('blur', onBlur);
          } else if (e.data.type === 'PLIA_REPLACE_IMG' && selected && selected.tagName === 'IMG') {
            swapImg(selected, e.data.url);
          } else if (e.data.type === 'PLIA_DRAG_OVER') {
            // Drag de un asset desde el editor (coords en el viewport del
            // iframe). Resaltamos la imagen bajo el cursor como destino.
            var elAt = document.elementFromPoint(e.data.x, e.data.y);
            if (dropTarget && dropTarget !== elAt) dropTarget.classList.remove('plia-drop');
            if (elAt && elAt.tagName === 'IMG') {
              dropTarget = elAt;
              elAt.classList.add('plia-drop');
              send('PLIA_DRAG_FEEDBACK', { over: true });
            } else {
              dropTarget = null;
              send('PLIA_DRAG_FEEDBACK', { over: false });
            }
          } else if (e.data.type === 'PLIA_DRAG_DROP') {
            var dropEl = document.elementFromPoint(e.data.x, e.data.y);
            if (dropTarget) dropTarget.classList.remove('plia-drop');
            dropTarget = null;
            if (dropEl && dropEl.tagName === 'IMG') {
              swapImg(dropEl, e.data.url);
            }
          } else if (e.data.type === 'PLIA_DRAG_END') {
            if (dropTarget) { dropTarget.classList.remove('plia-drop'); dropTarget = null; }
          }
        });

        document.addEventListener(
          'mouseover',
          function (e) {
            if (mode !== 'select') return;
            var el = e.target;
            if (!isSelectable(el)) return;
            if (hovered && hovered !== el) hovered.classList.remove('plia-hover');
            hovered = el;
            el.classList.add('plia-hover');
          },
          true
        );
        document.addEventListener(
          'click',
          function (e) {
            if (mode !== 'select') return;
            var el = e.target;
            if (!isSelectable(el)) return;
            e.preventDefault();
            e.stopPropagation();
            if (selected) selected.classList.remove('plia-selected');
            if (hovered) hovered.classList.remove('plia-hover');
            selected = el;
            el.classList.add('plia-selected');
            send('PLIA_ELEMENT_SELECTED', describe(el));
            showPadHandles();
          },
          true
        );

        // ─── PADDING + RESIZE estilo Framer ───────────────────────────────
        // Solo sobre CONTENEDORES (section/div con hijos…). Cada lado tiene una
        // "zona" sensible: al pasar el cursor se colorea la franja del padding y
        // aparece una barrita; arrastrarla cambia el padding de ese lado en vivo
        // con etiqueta en px. Además, tiradores de resize (E/S/SE) cambian el
        // ancho/alto del contenedor con badge de dimensiones. Todo se persiste.
        var padZoom = 1;
        var ui = null; // { wrap, pad:{top,right,bottom,left:{zone,fill,bar}}, resize:{e,s,se}, tip, badge }
        var padDrag = null;
        var resizeDrag = null;
        var PAD_SIDES = ['top', 'right', 'bottom', 'left'];
        var ACCENT = '#8b5cf6';
        var ACCENT_FILL = 'rgba(139,92,246,0.22)';

        function pxOf(el, prop) {
          var v = parseFloat(window.getComputedStyle(el)[prop]);
          return isNaN(v) ? 0 : v;
        }
        // Ruta estable desde #root (robusta a cambios en otras ramas del DOM).
        function pathOf(el) {
          var parts = [];
          var root = document.getElementById('root') || document.body;
          while (el && el !== root && el !== document.body) {
            var p = el.parentNode;
            if (!p) break;
            var idx = Array.prototype.indexOf.call(p.children, el);
            parts.unshift(el.tagName + ':' + idx);
            el = p;
          }
          return parts.join('>');
        }
        function elByPath(path) {
          if (!path) return null;
          var cur = document.getElementById('root') || document.body;
          var parts = path.split('>');
          for (var i = 0; i < parts.length; i++) {
            var idx = parseInt(parts[i].split(':')[1], 10);
            if (!cur.children || !cur.children[idx]) return null;
            cur = cur.children[idx];
          }
          return cur;
        }
        function mkEl(css) {
          var d = document.createElement('div');
          d.setAttribute('data-plia-ui', '1');
          d.style.cssText = css;
          return d;
        }
        function place(el, l, t, w, h) {
          el.style.left = l + 'px';
          el.style.top = t + 'px';
          el.style.width = Math.max(0, w) + 'px';
          el.style.height = Math.max(0, h) + 'px';
        }
        function placeC(el, x, y, size) {
          el.style.left = x + 'px';
          el.style.top = y + 'px';
          el.style.width = size + 'px';
          el.style.height = size + 'px';
          el.style.transform = 'translate(-50%,-50%)';
        }
        function ensureUI() {
          if (ui) return ui;
          var wrap = mkEl('position:absolute;left:0;top:0;z-index:2147483600;pointer-events:none;');
          var TIP = 'position:absolute;display:none;background:' + ACCENT + ';color:#fff;' +
            'font:700 11px/1 ui-sans-serif,system-ui,sans-serif;padding:4px 7px;border-radius:5px;' +
            'white-space:nowrap;pointer-events:none;box-shadow:0 1px 4px rgba(0,0,0,.3);transform-origin:center;';
          var pad = {};
          PAD_SIDES.forEach(function (side) {
            var vertical = side === 'top' || side === 'bottom';
            // Franja coloreada del padding (solo visual, aparece al hover/drag).
            var fill = mkEl('position:absolute;display:none;background:' + ACCENT_FILL + ';pointer-events:none;');
            // Zona sensible (banda fina sobre el borde interno): hover + drag.
            var zone = mkEl('position:absolute;pointer-events:auto;background:transparent;' +
              (vertical ? 'cursor:ns-resize;' : 'cursor:ew-resize;'));
            // Barrita visual (la "—" de Framer), centrada en la zona.
            var bar = mkEl('position:absolute;left:50%;top:50%;background:' + ACCENT + ';border-radius:99px;' +
              'box-shadow:0 1px 3px rgba(0,0,0,.35);pointer-events:none;opacity:.5;');
            zone.appendChild(bar);
            zone.addEventListener('mouseenter', (function (f, b) {
              return function () { if (!padDrag && !resizeDrag) { f.style.display = 'block'; b.style.opacity = '1'; } };
            })(fill, bar));
            zone.addEventListener('mouseleave', (function (f, b) {
              return function () { if (!padDrag) { f.style.display = 'none'; b.style.opacity = '.5'; } };
            })(fill, bar));
            zone.addEventListener('mousedown', (function (s) {
              return function (ev) { startPadDrag(ev, s); };
            })(side));
            wrap.appendChild(fill);
            wrap.appendChild(zone);
            pad[side] = { zone: zone, fill: fill, bar: bar };
          });
          var resize = {};
          ['e', 's', 'se'].forEach(function (hh) {
            var cur = hh === 'e' ? 'ew-resize' : hh === 's' ? 'ns-resize' : 'nwse-resize';
            var el = mkEl('position:absolute;pointer-events:auto;background:#fff;border:2px solid ' + ACCENT +
              ';border-radius:3px;box-shadow:0 1px 3px rgba(0,0,0,.3);cursor:' + cur + ';');
            el.addEventListener('mousedown', (function (k) {
              return function (ev) { startResize(ev, k); };
            })(hh));
            wrap.appendChild(el);
            resize[hh] = el;
          });
          var tip = mkEl(TIP);
          var badge = mkEl(TIP);
          wrap.appendChild(tip);
          wrap.appendChild(badge);
          document.body.appendChild(wrap);
          ui = { wrap: wrap, pad: pad, resize: resize, tip: tip, badge: badge };
          return ui;
        }
        function layoutPadHandles() {
          if (!ui || !selected) return;
          var r = selected.getBoundingClientRect();
          var sx = window.scrollX || 0, sy = window.scrollY || 0;
          var inv = 1 / (padZoom || 1);
          var HIT = 14 * inv; // grosor sensible de la zona (px del sitio)
          var pT = pxOf(selected, 'paddingTop'), pR = pxOf(selected, 'paddingRight'),
            pB = pxOf(selected, 'paddingBottom'), pL = pxOf(selected, 'paddingLeft');
          var L = r.left + sx, T = r.top + sy, R = r.right + sx, B = r.bottom + sy;
          var cx = L + r.width / 2, cy = T + r.height / 2;
          var eT = T + pT, eB = B - pB, eL = L + pL, eR = R - pR; // bordes internos
          // Zonas (banda fina sobre el borde interno) + franjas coloreadas.
          place(ui.pad.top.zone, L, eT - HIT / 2, r.width, HIT);
          place(ui.pad.top.fill, L, T, r.width, pT);
          place(ui.pad.bottom.zone, L, eB - HIT / 2, r.width, HIT);
          place(ui.pad.bottom.fill, L, eB, r.width, pB);
          place(ui.pad.left.zone, eL - HIT / 2, T, HIT, r.height);
          place(ui.pad.left.fill, L, T, pL, r.height);
          place(ui.pad.right.zone, eR - HIT / 2, T, HIT, r.height);
          place(ui.pad.right.fill, eR, T, pR, r.height);
          // Barras contra-escaladas (tamaño visual constante).
          PAD_SIDES.forEach(function (side) {
            var vertical = side === 'top' || side === 'bottom';
            var bar = ui.pad[side].bar;
            bar.style.width = (vertical ? 30 : 5) * inv + 'px';
            bar.style.height = (vertical ? 5 : 30) * inv + 'px';
            bar.style.transform = 'translate(-50%,-50%)';
          });
          // Tiradores de resize: E (medio derecho), S (medio inferior), SE (esquina).
          var hs = 11 * inv;
          placeC(ui.resize.e, R, cy, hs);
          placeC(ui.resize.s, cx, B, hs);
          placeC(ui.resize.se, R, B, hs);
        }
        function showPadHandles() {
          // Padding/resize SOLO sobre contenedores (no texto suelto ni imágenes).
          if (!selected || !isContainer(selected)) { hidePadHandles(); return; }
          ensureUI();
          ui.wrap.style.display = 'block';
          layoutPadHandles();
        }
        function hidePadHandles() {
          if (ui) ui.wrap.style.display = 'none';
        }
        function sendOverride(style) {
          if (!selected) return;
          // El editor persiste este mapa de estilos por proyecto+ruta DOM.
          send('PLIA_PADDING_CHANGED', { path: pathOf(selected), padding: style });
        }
        function placeTip(el, x, y, inv) {
          el.style.left = x + 'px';
          el.style.top = y + 'px';
          el.style.transform = 'translate(-50%,-50%) scale(' + inv + ')';
        }
        function startPadDrag(e, side) {
          e.preventDefault();
          e.stopPropagation();
          if (!selected) return;
          var prop = 'padding' + side.charAt(0).toUpperCase() + side.slice(1);
          padDrag = { side: side, prop: prop, startX: e.clientX, startY: e.clientY, startVal: pxOf(selected, prop) };
          ui.pad[side].fill.style.display = 'block';
          ui.pad[side].bar.style.opacity = '1';
          ui.tip.style.display = 'block';
          document.addEventListener('mousemove', onPadMove, true);
          document.addEventListener('mouseup', onPadUp, true);
        }
        function onPadMove(e) {
          if (!padDrag || !selected) return;
          e.preventDefault();
          // El delta de clientX/Y dentro del iframe YA está en px del sitio (el
          // navegador reporta coords en el espacio CSS del iframe, sin el escalado
          // del lienzo), así que NO hay que dividir por zoom.
          var d;
          if (padDrag.side === 'top') d = e.clientY - padDrag.startY;        // abajo = +
          else if (padDrag.side === 'bottom') d = padDrag.startY - e.clientY; // arriba = +
          else if (padDrag.side === 'left') d = e.clientX - padDrag.startX;   // derecha = +
          else d = padDrag.startX - e.clientX;                                // izquierda = +
          var val = Math.max(0, Math.round(padDrag.startVal + d));
          selected.style[padDrag.prop] = val + 'px';
          layoutPadHandles();
          // Cuadrito con el valor en px, en la franja del padding (no tapa texto).
          var r = selected.getBoundingClientRect();
          var sx = window.scrollX || 0, sy = window.scrollY || 0, inv = 1 / (padZoom || 1);
          var cx = r.left + sx + r.width / 2, cy = r.top + sy + r.height / 2, o = 16 * inv;
          var pos = {
            top: [cx, r.top + sy + val - o],
            bottom: [cx, r.bottom + sy - val + o],
            left: [r.left + sx + val - o, cy],
            right: [r.right + sx - val + o, cy],
          }[padDrag.side];
          ui.tip.textContent = val + ' px';
          placeTip(ui.tip, pos[0], pos[1], inv);
        }
        function onPadUp() {
          document.removeEventListener('mousemove', onPadMove, true);
          document.removeEventListener('mouseup', onPadUp, true);
          if (padDrag && selected) {
            sendOverride({
              paddingTop: Math.round(pxOf(selected, 'paddingTop')) + 'px',
              paddingRight: Math.round(pxOf(selected, 'paddingRight')) + 'px',
              paddingBottom: Math.round(pxOf(selected, 'paddingBottom')) + 'px',
              paddingLeft: Math.round(pxOf(selected, 'paddingLeft')) + 'px',
            });
          }
          if (ui) {
            ui.tip.style.display = 'none';
            PAD_SIDES.forEach(function (s) { ui.pad[s].fill.style.display = 'none'; ui.pad[s].bar.style.opacity = '.5'; });
          }
          padDrag = null;
        }
        // ─── Resize del contenedor (ancho/alto) con badge de dimensiones ───
        function startResize(e, h) {
          e.preventDefault();
          e.stopPropagation();
          if (!selected) return;
          var r = selected.getBoundingClientRect();
          resizeDrag = { h: h, startX: e.clientX, startY: e.clientY, startW: r.width, startH: r.height };
          ui.badge.style.display = 'block';
          document.addEventListener('mousemove', onResizeMove, true);
          document.addEventListener('mouseup', onResizeUp, true);
        }
        function onResizeMove(e) {
          if (!resizeDrag || !selected) return;
          e.preventDefault();
          var h = resizeDrag.h;
          if (h === 'e' || h === 'se')
            selected.style.width = Math.max(16, Math.round(resizeDrag.startW + (e.clientX - resizeDrag.startX))) + 'px';
          if (h === 's' || h === 'se')
            selected.style.height = Math.max(16, Math.round(resizeDrag.startH + (e.clientY - resizeDrag.startY))) + 'px';
          layoutPadHandles();
          var r = selected.getBoundingClientRect();
          var sx = window.scrollX || 0, sy = window.scrollY || 0, inv = 1 / (padZoom || 1);
          ui.badge.textContent = Math.round(r.width) + ' × ' + Math.round(r.height);
          placeTip(ui.badge, r.left + sx + r.width / 2, r.bottom + sy + 18 * inv, inv);
        }
        function onResizeUp() {
          document.removeEventListener('mousemove', onResizeMove, true);
          document.removeEventListener('mouseup', onResizeUp, true);
          if (resizeDrag && selected) {
            var st = {}, r = selected.getBoundingClientRect();
            if (resizeDrag.h === 'e' || resizeDrag.h === 'se') st.width = Math.round(r.width) + 'px';
            if (resizeDrag.h === 's' || resizeDrag.h === 'se') st.height = Math.round(r.height) + 'px';
            sendOverride(st);
          }
          if (ui) ui.badge.style.display = 'none';
          resizeDrag = null;
        }
        // Re-aplica overrides guardados (el editor los re-envía al cargar).
        // Reintentamos porque React monta el árbol de forma asíncrona.
        var pendingOverrides = null;
        function applyOverrides() {
          if (!pendingOverrides) return;
          for (var path in pendingOverrides) {
            if (!pendingOverrides.hasOwnProperty(path)) continue;
            var el = elByPath(path);
            if (!el) continue;
            var st = pendingOverrides[path];
            for (var k in st) { if (st.hasOwnProperty(k)) el.style[k] = st[k]; }
          }
          if (selected) layoutPadHandles();
        }
        window.addEventListener('resize', layoutPadHandles);
      })();
    </script>

    <script>
      (function () {
        if (window.parent === window) return; // no estamos en iframe
        var capturing = false;
        window.addEventListener('message', async function (e) {
          if (!e.data || e.data.type !== 'PLIA_CAPTURE') return;
          if (capturing) return;
          capturing = true;
          try {
            if (!window.html2canvas) {
              await new Promise(function (resolve, reject) {
                var s = document.createElement('script');
                s.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
                s.onload = resolve;
                s.onerror = reject;
                document.head.appendChild(s);
              });
            }
            var canvas = await window.html2canvas(document.body, {
              width: 1280,
              height: 720,
              windowWidth: 1280,
              windowHeight: 720,
              scale: 0.5,
              useCORS: true,
              backgroundColor: null,
              logging: false,
              allowTaint: true,
            });
            var dataUrl = canvas.toDataURL('image/jpeg', 0.7);
            (e.source || window.parent).postMessage(
              { type: 'PLIA_SHOT', dataUrl: dataUrl },
              '*'
            );
          } catch (err) {
            console.warn('[PLIA] thumbnail capture fallo:', err && err.message);
          } finally {
            capturing = false;
          }
        });
      })();
    </script>
  </body>
</html>
